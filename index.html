<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVIES</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js" defer></script>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="nav__container">
      <img  class="logo" src="./assets-folder/MovieLOGO.png" alt="">
      <ul class="nav__links">
        <li><a href="#" class="nav__link">Home</a></li>
        <li><a href="#" class="nav__link">Find your Movie</a></li>
        <li><a href="#" 
        class="nav__link nav__link--primary">Contact</a></li>
        </ul>
      <button class="btn__menu" onclick="openMenu()"></button>
      <div class="menu__backdrop">
        <button class="btn__menu btn__menu--close" onclick="closeMenu()">
          <i class="fas fa-times"></i>
        </button>
        <ul>
          <li class="menu__links">
            <li class="menu_-list">
            <a href="#" class="menu__link">Home</a>
          </li><li class="menu__list">
            <a href="#features" class="menu__link">Books</a>
          </li>
          <li class="menu__list">
            <a href="menu__link no-cursor" onclick="closeMenu()">Contact</a>
          </li>
        </ul>
      </div>
    </nav>
  </section>

    <body>
      <div class="header__container">
       <h1 class="header__description">Browse our Movies</h1>
        <figure class="header__img--wrapper">
          <img src="./assets-folder/MovieScreen.png" alt="">
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by title"
            oninput="onSearchChange(event)">
          </div>
    </figure>
    <section class="movie__list">
      <h2 class="search-info">
      <span class="black-txt">Search results</span>
      <span class="search-term"><span class="searchName"></span>
      </h2>
      <section class="movie-list">
      
      <div id="movieWrapper">
        <div class="movieWrapper-img"></div>
      </div>
    </section>
  </section>
   
</body>
</html>
